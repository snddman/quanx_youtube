# Quantumult X - YouTube Enhance
# Converted from the supplied Surge module.
# Requires Quantumult X with script rewrite support and MITM.
#
# Files in the same repository:
#   YouTube.Enhance.conf
#   youtube.request.js
#   youtube.response.js
#
# If this .conf is loaded as a remote rewrite resource, the JS files should be
# accessible from the same GitHub repository URL used below.

[rewrite_local]

# YouTube / YouTube Music Innertube response
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config)(\?.*)?$ url script-response-body https://raw.githubusercontent.com/snddman/quanx_youtube/master/youtube.response.js

# YouTube initplayback request
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.* url script-request-body https://raw.githubusercontent.com/snddman/quanx_youtube/master/youtube.request.js

# YouTube log_event request
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event url script-request-header https://raw.githubusercontent.com/snddman/quanx_youtube/master/youtube.request.js

[mitm]
hostname = %APPEND% *.googlevideo.com, youtubei.googleapis.com
